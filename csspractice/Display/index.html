<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 中的Display 屬性</title>
    <style>
        div {
            /* display: inline; */
            height: 100px;
            display: inline-block;
        }
        span {
            display:block;
        }
        p {
            display: none;
        }
    </style>
</head>
<body>
    <div>一個div (block 區塊)</div>  
    <span>span 1 (inline 行內)</span>
    <span>span 2</span>
    <span>span 3</span>
    <span>span 4</span>
    <span>span 5</span>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse itaque corporis eos aperiam! Minus excepturi iure iusto quidem itaque libero a perferendis vitae illum veritatis harum laudantium animi, perspiciatis repellat?</p>
</body>
</html>
