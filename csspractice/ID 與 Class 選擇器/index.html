<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID 與 Class 選擇器</title>
    <style>
        #content_header {
            color: orange;
        }
        .highlight {
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h2>標題</h2>
    </header>
    <h2 id="content_header">內容標題</h2>
    <p>
        段落1<span class="highlight">強調</span>
    </p>
    <p>
        段落2<span class="highlight">強調</span>
    </p>
</body>
</html>
