<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 選擇器：用 CSS 選擇元素</title>
    <style>
        h1 {
            color: blue;
            font-size: 50px;
        }
        p {
            color: red;
        }
        a {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>標題1</h1>
    <p>段落1</p>
    <p>端落2</p>
    <a href="#">連結</a>
    <span>span標籤</span>
</body>
</html>
