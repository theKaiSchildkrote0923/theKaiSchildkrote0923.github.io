<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子選擇器 Child Selector</title>
    <style>
        #main-content > div > p {
            color: orange;
        }
    </style>
</head>
<body>
    <div id="main-content">
        <p>直接子節點</p>
        <div>
            <p>不是直接子節點，是孫節點</p>
        </div>
    </div>
</body>
</html>
