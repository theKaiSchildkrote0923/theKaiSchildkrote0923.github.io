<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 的顏色</title>
    <style>
        body{
            color: blue;
        }
        #p1 {
            color: tomato;
        }
        #p2 {
            color: rgb(100, 100, 100)
        }
        #p3 {
            color: #FFFFFF;
            background-color: #000000;
        }
        #p4{
            /* H: 色調；S: 飽和度；L: 亮度 */
            color: hsl(250, 75%, 25%)
        }
    </style>
</head>
<body>
    <p id="p1">第一段文字</p>
    <p id="p2">第二段文字</p>
    <p id="p3">第三段文字</p>
    <p id="p4">第四段文字</p>
</body>
</html>
