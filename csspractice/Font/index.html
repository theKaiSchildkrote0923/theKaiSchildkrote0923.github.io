<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 字體 font</title>
    <!-- google連結 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Tint&display=swap" rel="stylesheet">
    <style>
        /* 本地檔案 */
        @font-face {
            font-family: 'Bungee Tint';
            src: url('./fonts/BungeeTint-Regular.ttf')
        }
        h1 {
            font-family: "Bungee Tint", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        p {
            font-family: cursive, sans-serif;
            font-size: 2em;
            font-weight: normal;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Hello!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cum molestias, dicta nostrum dolor veritatis rem placeat laudantium mollitia quos. Veritatis debitis distinctio perspiciatis placeat nisi maxime voluptates reprehenderit optio voluptate.</p>
</body>
</html>
