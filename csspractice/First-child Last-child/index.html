<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        第一子元素與最後子元素
        first-child and last-child
    </title>
    <style>
        article p:first-child {
            color: green;
        }
        article p:last-child {
            color: blue;
        }
    </style>
</head>
<body>
    <article>
        <p>第一段文字</p>
        <p>第二段文字</p>
        <p>第三段文字</p>
    </article>
    <article>
        <p>第一段文字</p>
        <p>第二段文字</p>
        <p>第三段文字</p>
    </article>
    <article>
        <p>第一段文字</p>
        <p>第二段文字</p>
        <p>第三段文字</p>
    </article>
</body>
</html>
