<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML 中的換行、註解與空格</title>
</head>
<body>
    <h1>這是第一個標題</h1>
    <p>這是第一段文字</p>
    <br>
    <!-- <br> 空一行, ctrl + / 註解 -->
    <h2>這是第二個標題</h2>
    <p>這是&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;第二段文字</p>
    <!-- &nbsp; 空一格 -->
</body>
</html>
