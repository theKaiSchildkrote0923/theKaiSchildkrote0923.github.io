<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML 表單(Form) 單選 Radio Button 多選 Checkbox</title>
</head>
<body>
    <label for="">
        <input type="radio" name="question1" value="yes">
        是
    </label>
    <label for="">
        <input type="radio" name="question1" value="no">
        否
    </label>
    <br>
    <form action="">
        <h3>你喜歡什麼運動？</h3>
        <input type="checkbox" name="sports" id="">
        <label for="">足球</label>
        <input type="checkbox" name="sports" id="">
        <label for="">籃球</label>
        <input type="checkbox" name="sports" id="">
        <label for="">美式足球</label>
        <input type="checkbox" name="sports" id="">
        <label for="">棒球</label>
        <input type="checkbox" name="sports" id="">
        <label for="">排球</label>
        <input type="checkbox" name="sports" id="">
        <label for="">羽球</label>
        <br>
        <input type="submit" value="提交">
    </form>
</body>
</html>
