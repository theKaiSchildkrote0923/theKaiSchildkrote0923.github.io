<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格 Table</title>
    <style>
        /* css */
        table, tr, th, td{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>國文</th>
            <th>英文</th>
            <th>數學</th>
        </tr>
        <tr>
            <td>李白</td>
            <td>abc</td>
            <td>1+1=2</td>
        </tr>
    </table>
</body>
</html>
