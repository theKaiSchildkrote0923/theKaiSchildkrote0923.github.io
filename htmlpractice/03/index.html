<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無序列表與有序列表</title>
</head>
<body>
    <h2>無序列表</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cat</li>
    </ul>

    <h2>有序列表</h2>
    <ol>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ol>
</body>
</html>
