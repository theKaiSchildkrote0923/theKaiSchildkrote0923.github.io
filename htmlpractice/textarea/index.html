<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 表單(Form) 文字輸入區塊 textarea</title>
</head>
<body>
    <h1>Welcome!</h1>
    <form action="">
        <label for="comment">評論或反饋</label>
        <br>
        <textarea name="commit" id="commit" cols="30" rows="10"></textarea>
        <br>
        <input type="submit" value="提交">
    </form>
</body>
</html>
